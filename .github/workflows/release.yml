# Builds release bundles for Windows, macOS (Apple Silicon) and Linux when a
# v* tag is pushed, and attaches them to a DRAFT GitHub Release. A maintainer
# reviews the draft and publishes it by hand.
#
# Each bundle includes depot-core, the sidecar that runs the six tools'
# pinned Python cores, built here with PyInstaller for that platform.
# Signing switches on by itself when its secrets exist (docs/RELEASING.md):
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            and for notarization APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8
#   Windows: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID,
#            AZURE_TRUSTED_SIGNING_ENDPOINT, _ACCOUNT, _PROFILE
# Without them each platform builds unsigned, as before. The macOS sidecar is
# signed while it is built, before Tauri signs the app around it.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: ''
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      DEPOT_PYTHON: python
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # macOS: import the Developer ID certificate into a throwaway keychain
      # before depot-core is built, so PyInstaller can sign it and its packed
      # runtime. tauri-action then finds the same identity in the keychain.
      - name: Set up macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No macOS signing secrets: building unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/depot-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "DEPOT_CODESIGN_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::macOS build will be signed but not notarized: APPLE_API_* secrets are missing."
          fi

      # Windows: Azure Trusted Signing, through trusted-signing-cli, which
      # reads AZURE_CLIENT_ID / _SECRET / _TENANT_ID from the environment.
      - name: Set up Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT AZURE_TRUSTED_SIGNING_PROFILE; do
            if [ -z "${!v}" ]; then
              echo "No Windows signing secrets ($v is missing): building unsigned."
              exit 0
            fi
          done
          cargo install trusted-signing-cli --locked
          for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT AZURE_TRUSTED_SIGNING_PROFILE; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python -m unittest discover -s core/tests
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # The sidecar is built for the runner's own architecture, so each
      # bundle is native to its runner (macos-latest is Apple Silicon).
      - name: Build and smoke-test the depot-core sidecar
        shell: bash
        run: |
          python -m pip install pyinstaller
          python scripts/build-core.py
          python scripts/smoke-core.py src-tauri/binaries/depot-core-*

      - name: Check the macOS sidecar signature
        if: runner.os == 'macOS' && env.DEPOT_CODESIGN_IDENTITY != ''
        run: codesign --verify --strict --verbose=2 src-tauri/binaries/depot-core-*

      - name: Write the release config
        run: python scripts/release-config.py src-tauri/tauri.release.conf.json

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Depot ${{ github.ref_name }}
          releaseBody: "See CHANGELOG.md for what changed. Each file's signing is listed in the build log (Write the release config); builds without signing secrets are unsigned."
          releaseDraft: true
          prerelease: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

      - name: Check the macOS app signature
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app/Contents/MacOS/depot-core"
          if [ -n "$APPLE_API_KEY_PATH" ]; then xcrun stapler validate "$app"; fi

      - name: Check the Windows signatures
        if: runner.os == 'Windows' && env.AZURE_TRUSTED_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi
          $files += Get-Item src-tauri/target/release/depot.exe, src-tauri/target/release/depot-core.exe -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Output "$($sig.Status)  $($f.Name)"
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not signed" }
          }
