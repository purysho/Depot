[package]
name = "depot"
version = "0.1.0"
description = "A local-first developer environment"
authors = ["purysho"]
license = "MIT"
repository = "https://github.com/purysho/Depot"
edition = "2021"
rust-version = "1.85"

# Tauri v2 layout: the app lives in a library so the same code can be the
# desktop binary (main.rs) and, later, a mobile entry point. The `_lib`
# suffix keeps the library name distinct from the binary on Windows
# (rust-lang/cargo#8519).
[lib]
name = "depot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "6"
which = "8"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
